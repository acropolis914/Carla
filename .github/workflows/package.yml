name: Multi-distro packaging

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 0 * * 0'  # weekly build

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't cancel other distros if one fails
      matrix:
        include:
          - platform: alpine
            image: alpine:latest
          - platform: ubuntu
            image: ubuntu:latest
          - platform: fedora
            image: fedora:latest
          - platform: archlinux
            image: archlinux:latest
          - platform: void-glibc
            image: ghcr.io/void-linux/void-glibc-full:latest
          - platform: void-musl
            image: ghcr.io/void-linux/void-musl-full:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        id: install
        run: |
          case "${{ matrix.platform }}" in
            alpine)
              apk add --no-cache \
                git make gcc g++ musl-dev pkgconf \
                qt6-qtbase-dev qt6-qtsvg-dev qt6-qttools-dev \
                python3 py3-qt6 sdl2-dev zstd tar \
                musl-fts-dev
              ;;
            ubuntu)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                git make build-essential pkg-config \
                qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
                python3 python3-pyqt6 libsdl2-dev \
                debhelper dh-make zstd tar
              ;;
            fedora)
              dnf install -y \
                git make gcc gcc-c++ pkgconf \
                qt6-qtbase-devel qt6-qtsvg-devel qt6-qttools-devel \
                python3 python3-pyqt6 SDL2-devel \
                rpm-build rpmdevtools zstd tar
              ;;
            archlinux)
              pacman -Syu --noconfirm \
                git base-devel \
                qt6-base qt6-svg qt6-tools \
                python python-pyqt6 sdl2 zstd tar
              ;;
            void-glibc)
              xbps-install -S -y ca-certificates xbps || true
              xbps-install -Syu -y \
                base-devel pkg-config git \
                qt6-base-devel qt6-svg-devel qt6-tools qt6-tools-devel \
                python3-pyqt6 SDL2-devel zstd tar
              ;;
            void-musl)
              xbps-install -S -y ca-certificates xbps || true
              xbps-install -Syu -y \
                base-devel pkg-config git \
                qt6-base-devel qt6-svg-devel qt6-tools qt6-tools-devel \
                python3-pyqt6 SDL2-devel musl-fts-devel zstd tar
              ;;
          esac

      - name: Build project
        id: compile
        run: |
          if [ "${{ matrix.platform }}" = "alpine" ] || [ "${{ matrix.platform }}" = "void-musl" ]; then
            export LDFLAGS="-lfts $LDFLAGS"
          fi

          make DEFAULT_QT=6 2>&1 | tee build.log

      - name: Package artifacts
        id: pkg
        if: steps.compile.outcome == 'success'
        run: |
          case "${{ matrix.platform }}" in
            alpine|void-glibc|void-musl)
              mkdir -p /tmp/clara-pkg
              make install PREFIX=/usr DESTDIR=/tmp/clara-pkg DEFAULT_QT=6 || cp -r bin /tmp/clara-pkg/
              tar --zstd -cf clara-${{ matrix.platform }}-${{ github.sha }}.tar.zst -C /tmp/clara-pkg .
              echo "OUTFILE=clara-${{ matrix.platform }}-${{ github.sha }}.tar.zst" >> "$GITHUB_ENV"
              ;;
            archlinux)
              mkdir -p /tmp/clara-pkg
              make install PREFIX=/usr DESTDIR=/tmp/clara-pkg DEFAULT_QT=6 || cp -r bin /tmp/clara-pkg/
              tar --zstd -cf clara-archlinux-${{ github.sha }}.tar.zst -C /tmp/clara-pkg .
              echo "OUTFILE=clara-archlinux-${{ github.sha }}.tar.zst" >> "$GITHUB_ENV"
              ;;
            ubuntu)
              mkdir -p /tmp/clara-deb/DEBIAN
              make install PREFIX=/usr DESTDIR=/tmp/clara-deb DEFAULT_QT=6
              echo "Package: clara" > /tmp/clara-deb/DEBIAN/control
              echo "Version: 0.1.0-git${{ github.sha }}" >> /tmp/clara-deb/DEBIAN/control
              echo "Section: sound" >> /tmp/clara-deb/DEBIAN/control
              echo "Priority: optional" >> /tmp/clara-deb/DEBIAN/control
              echo "Architecture: amd64" >> /tmp/clara-deb/DEBIAN/control
              echo "Maintainer: CI Builder <ci@build.local>" >> /tmp/clara-deb/DEBIAN/control
              echo "Depends: libc6, libqt6core6, libqt6gui6, libqt6widgets6, python3, python3-pyqt6, libsdl2-2.0-0" >> /tmp/clara-deb/DEBIAN/control
              echo "Description: Clara audio application (Carla Improved)" >> /tmp/clara-deb/DEBIAN/control
              echo " Modular audio plugin host and patchbay based on Carla." >> /tmp/clara-deb/DEBIAN/control
              dpkg-deb --build /tmp/clara-deb clara-ubuntu-${{ github.sha }}.deb
              echo "OUTFILE=clara-ubuntu-${{ github.sha }}.deb" >> "$GITHUB_ENV"
              ;;
            fedora)
              mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              tar -czf ~/rpmbuild/SOURCES/clara-git-${{ github.sha }}.tar.gz \
                --transform 's,^,clara-git-${{ github.sha }}/,' \
                --exclude='.git' *
              SPEC_FILE=$(find . -maxdepth 2 -name "*.spec" | head -n 1)
              if [ -n "$SPEC_FILE" ]; then
                cp "$SPEC_FILE" ~/rpmbuild/SPECS/clara.spec
              else
                cp .github/workflows/specs/clara.spec ~/rpmbuild/SPECS/clara.spec
              fi
              rpmbuild -ba ~/rpmbuild/SPECS/clara.spec
              find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;
              echo "OUTFILE=$(ls *.rpm 2>/dev/null | head -n 1 || true)" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Record Status & Tail Log
        if: always()
        run: |
          mkdir -p status-reports
          OUTCOME="${{ job.status }}"
          DETAILS="All steps passed."
          if [ "$OUTCOME" != "success" ]; then
            if [ -f build.log ]; then
              DETAILS=$(tail -n 20 build.log | tr '\n' ' ' | sed 's/"/\\"/g')
            else
              DETAILS="Failed during dependency setup or packaging."
            fi
          fi
          echo "{\"platform\": \"${{ matrix.platform }}\", \"status\": \"$OUTCOME\", \"file\": \"${OUTFILE:-none}\", \"error\": \"$DETAILS\"}" > status-reports/${{ matrix.platform }}.json

      - name: Upload distro status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.platform }}
          path: status-reports/*.json
          retention-days: 1

      - name: Upload binary artifact
        if: steps.pkg.outcome == 'success' && env.OUTFILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-package
          path: ${{ env.OUTFILE }}

  build-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build with Nix
        id: compile
        run: |
          nix build --extra-experimental-features 'nix-command flakes' 2>&1 | tee build.log || nix-build nix/default.nix 2>&1 | tee build.log

      - name: Package artifacts
        id: pkg
        if: steps.compile.outcome == 'success'
        run: |
          if [ -e "./result" ]; then
            tar --zstd -cf clara-nix-${{ github.sha }}.tar.zst -C result .
          else
            tar --zstd -cf clara-nix-${{ github.sha }}.tar.zst bin/
          fi
          echo "OUTFILE=clara-nix-${{ github.sha }}.tar.zst" >> "$GITHUB_ENV"

      - name: Record Status & Tail Log
        if: always()
        run: |
          mkdir -p status-reports
          OUTCOME="${{ job.status }}"
          DETAILS="All steps passed."
          if [ "$OUTCOME" != "success" ]; then
            if [ -f build.log ]; then
              DETAILS=$(tail -n 20 build.log | tr '\n' ' ' | sed 's/"/\\"/g')
            else
              DETAILS="Failed during Nix build."
            fi
          fi
          echo "{\"platform\": \"nix\", \"status\": \"$OUTCOME\", \"file\": \"${OUTFILE:-none}\", \"error\": \"$DETAILS\"}" > status-reports/nix.json

      - name: Upload nix status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-nix
          path: status-reports/*.json
          retention-days: 1

      - name: Upload nix artifact
        if: steps.pkg.outcome == 'success' && env.OUTFILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: nix-package
          path: ${{ env.OUTFILE }}

  report:
    runs-on: ubuntu-latest
    needs: [build, build-nix]
    if: always()
    steps:
      - name: Download all status reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: Generate GitHub Run Summary
        run: |
          echo "## 📦 Multi-Distro Packaging Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | Artifact | Error Preview |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in reports/*.json; do
            [ -f "$file" ] || continue
            PLATFORM=$(jq -r '.platform' "$file")
            STATUS=$(jq -r '.status' "$file")
            OUTFILE=$(jq -r '.file' "$file")
            ERR=$(jq -r '.error' "$file" | cut -c 1-80)
            if [ "$STATUS" = "success" ]; then ICON="✅ Success"; ERR="—"; else ICON="❌ Failed"; fi
            echo "| **$PLATFORM** | $ICON | \`$OUTFILE\` | $ERR |" >> $GITHUB_STEP_SUMMARY
          done
